# 시험 전용. 진짜 api가 없는 동안 nginx 앞단을 검증하려고 가짜 api를 2개 띄운다.
# 서비스 이름을 계획 2의 진짜 api와 같은 `api`로 두어서 nginx 설정이 그대로 재사용된다.
# 사용: docker compose -f docker-compose.yml -f docker-compose.nginx-test.yml --profile proxy up -d
services:
  api:
    profiles: ["proxy"]
    image: nginx:1.30.7-alpine
    volumes:
      - ./ops/nginx/test/stub.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      replicas: 2
    mem_limit: 32m

  nginx:
    volumes:
      - ./ops/nginx/test/trust-docker-network.conf:/etc/nginx/conf.d/zz-test-trust.conf:ro
