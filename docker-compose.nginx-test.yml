# 시험 전용. 진짜 api가 없는 동안 nginx 앞단을 검증하려고 가짜 api를 2개 띄운다.
# 서비스 이름을 계획 2의 진짜 api와 같은 `api`로 두어서 nginx 설정이 그대로 재사용된다.
# 사용: docker compose -f docker-compose.yml -f docker-compose.nginx-test.yml --profile proxy up -d
services:
  api:
    profiles: ["proxy"]
    image: nginx:1.30.7-alpine
    environment:
      # 값을 바꾸면 compose가 설정이 달라진 것으로 보고 복제본을 교체 대상으로 삼는다(롤링 시험의 "새 버전").
      STUB_VERSION: ${STUB_VERSION:-1}
      # bad로 주면 헬스체크가 실패하는 "고장 난 새 버전"이 된다.
      STUB_HEALTH: ${STUB_HEALTH:-ok}
    # 진짜 api는 뜨는 데 10~30초가 걸린다. 가짜 api가 0.3초 만에 뜨면 복제본을 한꺼번에 교체해도 옛 컨테이너와 같은 주소를
    # 곧바로 다시 받아서 끊김이 거의 안 생기므로, 롤링 시험이 실제 상황을 흉내 내도록 시작을 늦출 수 있게 한다(기본은 즉시).
    command: ["sh", "-c", "sleep ${STUB_START_DELAY:-0}; exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD-SHELL", "[ \"$${STUB_HEALTH}\" = ok ] && wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 1s
      timeout: 2s
      retries: 3
      # 시작을 늦춰도(STUB_START_DELAY) 그 동안의 실패는 unhealthy로 세지 않는다.
      start_period: 10s
    volumes:
      - ./ops/nginx/test/stub.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      replicas: 2
    mem_limit: 32m

  nginx:
    volumes:
      - ./ops/nginx/test/trust-docker-network.conf:/etc/nginx/conf.d/zz-test-trust.conf:ro
