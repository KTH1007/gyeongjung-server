name: deploy

# 수동 실행만 한다. 자동 배포는 도메인과 TLS를 붙이는 #39에서 정한다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "배포할 이미지 태그(커밋 해시 7~40자). 비우면 이 커밋을 빌드해서 배포한다. 롤백은 이전 태그를 넣는다"
        type: string
        required: false
        default: ""
      skip_preflight:
        description: "사전 점검을 건너뛴다(점검이 막는 상황의 비상 롤백용)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# 배포는 한 번에 하나만 돌고, 진행 중인 배포를 취소하지 않는다(중간에 끊기면 서버 상태가 애매해진다).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # main의 커밋만 배포한다. 태그를 입력하면(롤백) 이미 올라간 이미지를 쓰므로 빌드하지 않는다.
    if: ${{ github.ref == 'refs/heads/main' && inputs.tag == '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 태그와 레지스트리 정하기
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        # ghcr는 소문자 이름만 받는다(KTH1007 -> kth1007).
        run: |
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: ghcr 로그인
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: 이미지 빌드와 푸시
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: ops/build-push.sh "$REGISTRY" "$TAG"

  deploy:
    needs: build
    # 롤백(태그 입력)이면 build가 건너뛰어져도 배포한다. build가 실패하면 배포하지 않는다.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 배포할 태그 정하고 검증하기
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          tag="${INPUT_TAG:-$BUILT_TAG}"
          if ! [[ $tag =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "태그는 소문자 16진수 7~40자(커밋 해시)여야 한다" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: 서버에 배포
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SKIP_PREFLIGHT: ${{ inputs.skip_preflight && '1' || '' }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$SERVER_KEY" > "$dir/key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$dir/known_hosts"
          DEPLOY_SSH_KEY_FILE="$dir/key" DEPLOY_KNOWN_HOSTS_FILE="$dir/known_hosts" ops/remote-deploy.sh "$TAG"
