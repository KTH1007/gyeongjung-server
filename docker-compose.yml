x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
    compress: "true"

# 같은 서버의 다른 서비스를 지키는 공통 설정. 서버에서 뜨는 모든 서비스가 가져다 쓴다.
# oom_score_adj: 서버 메모리가 바닥나면 커널이 우리를 먼저 종료한다.
# no-new-privileges: 컨테이너 안에서 더 높은 권한을 얻는 것을 막는다.
# 서비스마다 따로 거는 cpu_shares는 CPU가 모자랄 때의 우선순위다. 핵심 경로(mysql, worker, nginx)는 512,
# 배경 작업은 128이다. 같은 서버의 다른 서비스는 기본값 1024라서 우리는 모두 그보다 낮다.
x-shared-host: &shared-host
  oom_score_adj: 500
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:8.4
    <<: *shared-host
    cpu_shares: 512
    environment:
      MYSQL_DATABASE: gyeongjung
      MYSQL_USER: ${DB_USERNAME:?.env에 DB_USERNAME을 설정한다}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --innodb-buffer-pool-size=256M
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 1g
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: .
    image: gyeongjung-server
    <<: *shared-host
    cpu_shares: 512
    # 우리가 만든 이미지는 root가 아닌 사용자로 실행되어 리눅스 권한이 필요 없다. 공식 이미지는 시작할 때 필요할 수 있어 제외한다.
    cap_drop: [ALL]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gyeongjung
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 기본값은 application.yml과 같다. 서버 .env의 DB_POOL_MAX_SIZE 등으로 덮어쓴다.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT_MS:-3000}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    volumes:
      - worker-logs:/var/log/gyeongjung
    mem_limit: 768m
    stop_grace_period: 40s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.16.0
    <<: *shared-host
    cpu_shares: 128
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    ports:
      # 같은 서버의 다른 서비스가 9090을 쓰면 서버 .env의 PROMETHEUS_HOST_PORT로 피한다.
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:13.0.2
    <<: *shared-host
    cpu_shares: 128
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env에 GRAFANA_ADMIN_PASSWORD를 설정한다}
      # Grafana는 프로비저닝 파일이 사라져도 DB에 올라간 규칙과 contact point를 지우지 않는다.
      # 알림 오버레이를 뺀 채 같은 볼륨을 쓰면 규칙이 계속 평가되어 발송되므로 엔진은 기본으로 끈다.
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 384m
    logging: *default-logging

  nginx:
    profiles: ["proxy"]
    image: nginx:1.30.7-alpine
    <<: *shared-host
    cpu_shares: 512
    environment:
      # 한도는 설정 템플릿에 채워진다. 값을 바꾸면 컨테이너를 다시 만들어야 반영된다 (docker compose up -d nginx).
      LIMIT_WRITE_RATE: ${LIMIT_WRITE_RATE:-5}
      LIMIT_WRITE_BURST: ${LIMIT_WRITE_BURST:-20}
      LIMIT_CONN_PER_IP: ${LIMIT_CONN_PER_IP:-30}
      LIMIT_CONN_TOTAL: ${LIMIT_CONN_TOTAL:-400}
      # LIMIT_로 시작하는 변수만 채운다. 의도하지 않은 환경변수가 설정에 섞이지 않게 한다.
      NGINX_ENVSUBST_FILTER: ^LIMIT_
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/templates:/etc/nginx/templates:ro
      - ./ops/nginx/errors:/usr/share/nginx/errors:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    logging: *default-logging

  backup:
    profiles: ["backup"]
    build: ./ops/backup
    image: gyeongjung-backup
    <<: *shared-host
    cpu_shares: 128
    cap_drop: [ALL]
    entrypoint: ["bash", "/ops/backup/backup-loop.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: gyeongjung
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:-local}
      OFFSITE_URL: ${OFFSITE_URL:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      BACKUP_RETENTION_DAYS: "14"
      TZ: UTC
    volumes:
      - ./ops/backup:/ops/backup:ro
      - backup-data:/backups
      - backup-metrics:/metrics
    mem_limit: 128m
    stop_grace_period: 30s
    logging: *default-logging

  flyway:
    profiles: ["tools"]
    # redgate/flyway는 amd64만 있어서 arm64 맥에서 못 돌린다. flyway/flyway는 둘 다 지원한다.
    image: flyway/flyway:12.11.0
    volumes:
      - ${MIGRATIONS_DIR:-./app/src/main/resources/db/migration}:/flyway/sql:ro

  drill-mysql:
    profiles: ["tools"]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gyeongjung
      MYSQL_ROOT_PASSWORD: ${DRILL_DB_PASSWORD:-drill-throwaway}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
    tmpfs:
      - /var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DRILL_DB_PASSWORD:-drill-throwaway}"]
      interval: 3s
      timeout: 3s
      retries: 30

  node-exporter:
    image: prom/node-exporter:v1.13.1
    <<: *shared-host
    cpu_shares: 128
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/metrics
    volumes:
      - /:/host:ro
      - backup-metrics:/metrics:ro
    mem_limit: 64m
    logging: *default-logging

volumes:
  mysql-data:
  worker-logs:
  prometheus-data:
  grafana-data:
  backup-data:
  backup-metrics:
