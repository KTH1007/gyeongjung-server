x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
    compress: "true"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gyeongjung
      MYSQL_USER: ${DB_USERNAME:?.env에 DB_USERNAME을 설정한다}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --innodb-buffer-pool-size=256M
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 768m
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: .
    image: gyeongjung-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gyeongjung
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
    mem_limit: 512m
    stop_grace_period: 40s
    logging: *default-logging

volumes:
  mysql-data:
