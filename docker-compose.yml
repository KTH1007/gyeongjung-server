x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
    compress: "true"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gyeongjung
      MYSQL_USER: ${DB_USERNAME:?.env에 DB_USERNAME을 설정한다}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --innodb-buffer-pool-size=256M
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 768m
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: .
    image: gyeongjung-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gyeongjung
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    volumes:
      - worker-logs:/var/log/gyeongjung
    mem_limit: 512m
    stop_grace_period: 40s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env에 GRAFANA_ADMIN_PASSWORD를 설정한다}
      # Grafana는 프로비저닝 파일이 사라져도 DB에 올라간 규칙과 contact point를 지우지 않는다.
      # 알림 오버레이를 뺀 채 같은 볼륨을 쓰면 규칙이 계속 평가되어 발송되므로 엔진은 기본으로 끈다.
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    logging: *default-logging

  nginx:
    profiles: ["proxy"]
    image: nginx:1.30.7-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/errors:/usr/share/nginx/errors:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.13.1
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    mem_limit: 64m
    logging: *default-logging

volumes:
  mysql-data:
  worker-logs:
  prometheus-data:
  grafana-data:
