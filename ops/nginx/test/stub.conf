# 시험용 가짜 api. 어느 인스턴스가 받았는지(hostname)와 nginx가 넘긴 헤더를 그대로 돌려준다.
server {
    listen 8080;
    default_type text/plain;

    location / {
        return 200 "stub=$hostname request_id=$http_x_request_id xff=$http_x_forwarded_for xfp=$http_x_forwarded_proto host=$http_host\n";
    }

    # 동시 연결 제한 시험용. 응답을 초당 100바이트로 흘려서 요청이 20초 넘게 끝나지 않게 한다.
    # 즉시 끝나는 응답으로는 "동시에 처리 중인 요청"을 만들 수 없다.
    location /slow {
        limit_rate 100;
        return 200 "stub=$hostname slow=1 ................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................\n";
    }
}
