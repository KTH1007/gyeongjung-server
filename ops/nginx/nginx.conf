user nginx;
# 메모리 한도(64m) 안에서 사용량이 예측되도록 워커 수를 고정한다.
worker_processes 2;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1m;

    # 접근 로그: 실제 IP, 요청 ID(앱 로그의 requestId와 같은 값), 요청, 상태, 처리 시간, 업스트림 응답 시간.
    # IP는 앱 로그에 남기지 않는다고 정했으므로(#23) 이 로그가 IP를 맡고 rid로 앱 로그와 이어진다.
    log_format main 'ip=$remote_addr rid=$request_id "$request" $status rt=$request_time urt=$upstream_response_time bytes=$body_bytes_sent upstream=$upstream_addr cache=$upstream_cache_status';
    access_log /dev/stdout main;

    # Cloudflare 뒤에서 실제 방문자 IP를 복원한다. Cloudflare 대역에서 온 연결만 CF-Connecting-IP를 믿는다
    # (아무 연결이나 믿으면 헤더 위조로 IP를 속일 수 있다). 시험은 사설 대역을 더하는 파일을 conf.d에 끼우므로
    # 이 목록은 서버 블록이 아니라 http 수준에 둔다.
    # 출처: https://www.cloudflare.com/ips-v4/ , https://www.cloudflare.com/ips-v6/ (2026-11-23 기준). 바뀌면 갱신한다.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # compose의 api 컨테이너가 재시작해 IP가 바뀌어도 다시 찾도록 Docker 내장 DNS를 10초마다 확인한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 상태 API용 짧은 캐시 구역의 자리. 적용할 경로는 api가 생기는 계획 2에서 정한다.
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:1m max_size=16m inactive=1m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
