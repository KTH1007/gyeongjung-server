apiVersion: 1

groups:
  - orgId: 1
    name: worker
    folder: 운영
    interval: 1m
    rules:
      - uid: jvm-heap-high
        title: JVM 힙 사용률 85% 초과
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'worker JVM 힙 사용률이 {{ printf "%.0f" $values.B.Value }}%입니다'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * sum(jvm_memory_used_bytes{job="worker",area="heap"}) / sum(jvm_memory_max_bytes{job="worker",area="heap"} > 0)'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
      - uid: process-restarted
        title: worker 프로세스 재시작
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'worker 프로세스가 최근 10분 안에 재시작했습니다'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'changes(process_start_time_seconds{job="worker"}[10m])'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: target-down
        title: 타깃 다운 (up == 0)
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} 타깃이 응답하지 않습니다'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'up'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: hikari-pool-high
        title: DB 커넥션 풀 90% 초과
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'DB 커넥션 풀 사용률이 {{ printf "%.0f" $values.B.Value }}%입니다'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * hikaricp_connections_active{job="worker"} / hikaricp_connections_max{job="worker"}'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
      - uid: disk-low
        title: 디스크 여유 15% 미만
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '호스트 디스크 여유가 {{ printf "%.0f" $values.B.Value }}%입니다'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [15]
