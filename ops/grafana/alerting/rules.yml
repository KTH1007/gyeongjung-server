apiVersion: 1

groups:
  - orgId: 1
    name: worker
    folder: 운영
    interval: 1m
    rules:
      # worker 지표 규칙(힙, 재시작, DB 풀)은 noDataState를 OK로 둔다. worker가 죽으면 타깃 다운이 알리므로
      # 같은 원인의 DatasourceNoData 알림을 따로 받지 않는다.
      - uid: jvm-heap-high
        title: JVM 힙 사용률 85% 초과
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'worker JVM 힙 사용률이 {{ printf "%.0f" $values.B.Value }}%입니다'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * sum(jvm_memory_used_bytes{job="worker",area="heap"}) / sum(jvm_memory_max_bytes{job="worker",area="heap"} > 0)'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
      - uid: process-restarted
        title: worker 프로세스 재시작
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'worker 프로세스가 최근 10분 안에 재시작했습니다'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'changes(process_start_time_seconds{job="worker"}[10m])'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: target-down
        title: 타깃 다운 (up == 0)
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} 타깃이 응답하지 않습니다'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'up'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: hikari-pool-high
        title: DB 커넥션 풀 90% 초과
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'DB 커넥션 풀 사용률이 {{ printf "%.0f" $values.B.Value }}%입니다'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * hikaricp_connections_active{job="worker"} / hikaricp_connections_max{job="worker"}'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
      - uid: disk-low
        title: 디스크 여유 15% 미만
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          # NoData 상태에서는 $values.B가 비어 있어 printf가 %!f(<nil>)를 출력하므로 값이 있을 때만 숫자를 넣는다.
          summary: '{{ if $values.B }}호스트 디스크 여유가 {{ printf "%.0f" $values.B.Value }}%입니다{{ else }}호스트 디스크 여유를 측정할 수 없습니다. node-exporter와 마운트를 확인하세요{{ end }}'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [15]

  # 백업이 안 도는 경우를 잡는다. worker 규칙과 달리 지표가 아예 없는 것(백업이 한 번도 안 돌았거나 컨테이너가 죽음)이
  # 바로 알려야 할 상황이라 noDataState를 Alerting으로 둔다.
  - orgId: 1
    name: backup
    folder: 운영
    interval: 1m
    rules:
      - uid: backup-stale
        title: 백업이 12시간 넘게 성공하지 않음
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          # 지표가 없으면 쿼리가 9999를 돌려줘서 항상 값이 있는 상태로 발화한다. NoData 상태의 알림은 요약에 이전 값이 남아
          # "방금 성공했다"로 읽힐 수 있어서 값으로 "지표 없음"을 구분한다.
          summary: '{{ if $values.B }}{{ if gt $values.B.Value 9000.0 }}백업 지표가 없습니다. backup 컨테이너가 안 도는 것일 수 있습니다{{ else }}마지막 성공한 백업이 {{ printf "%.1f" $values.B.Value }}시간 전입니다{{ end }}{{ else }}백업 지표를 읽지 못했습니다{{ end }}'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '(time() - backup_last_success_timestamp_seconds) / 3600 or on() vector(9999)'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [12]
