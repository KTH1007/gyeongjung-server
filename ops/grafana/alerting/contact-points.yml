apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord
        type: discord
        settings:
          url: $__env{DISCORD_WEBHOOK_URL}
          title: '[$__env{ENVIRONMENT_NAME}] {{ template "default.title" . }}'
          message: '{{ template "default.message" . }}'

policies:
  - orgId: 1
    receiver: discord
    group_by: ['alertname', 'job']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
