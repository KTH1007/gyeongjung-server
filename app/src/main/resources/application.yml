server:
  port: -1                      # worker는 사용자 요청을 받지 않는다. api 역할은 계획 2에서 SERVER_PORT=8080으로 연다
  shutdown: graceful

management:
  server:
    port: 8081
    address: 127.0.0.1          # 기본은 이 머신에서만 접근한다. 컨테이너는 MANAGEMENT_SERVER_ADDRESS=0.0.0.0로 연다
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      role: ${app.role}

logging:
  file:
    name: logs/gyeongjung.log
  logback:
    rollingpolicy:
      file-name-pattern: "${logging.file.name}.%d{yyyy-MM-dd, UTC}.%i.gz"
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
  pattern:
    correlation: "[%X] "

spring:
  application:
    name: gyeongjung-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  role: worker
