server:
  shutdown: graceful

logging:
  file:
    name: logs/gyeongjung.log
  logback:
    rollingpolicy:
      file-name-pattern: "${logging.file.name}.%d{yyyy-MM-dd, UTC}.%i.gz"
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
  pattern:
    correlation: "[%X] "

spring:
  application:
    name: gyeongjung-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  role: worker
