server:
  port: -1                      # worker는 사용자 요청을 받지 않는다. api 역할은 계획 2에서 SERVER_PORT=8080으로 연다
  shutdown: graceful
  tomcat:
    # worker는 웹 포트를 닫아서 지금은 효과가 없다. api가 생기면 적용되는 과부하 한도의 자리이고 값은 측정 전 제안이다(계획 2에서 확정).
    # 환경변수 SERVER_TOMCAT_THREADS_MAX 등으로 덮어쓴다. DB 풀이 5라서 DB를 쓰는 요청은 동시에 5개뿐이므로 스레드를 기본 200개까지 둘 이유가 없다.
    threads:
      max: 50
    # 모든 스레드가 찼을 때 줄 세우는 연결 수. 넘으면 연결을 거절한다
    accept-count: 50
    # 한 인스턴스만 남아도 nginx 전체 동시 연결 한도(400)를 혼자 받게 해서 거절은 nginx가 먼저 하게 한다
    max-connections: 400

management:
  server:
    port: 8081
    address: 127.0.0.1          # 기본은 이 머신에서만 접근한다. 컨테이너는 MANAGEMENT_SERVER_ADDRESS=0.0.0.0로 연다
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      role: ${app.role}

logging:
  file:
    name: logs/gyeongjung.log
  logback:
    rollingpolicy:
      file-name-pattern: "${logging.file.name}.%d{yyyy-MM-dd, UTC}.%i.gz"
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
  pattern:
    correlation: "[%X] "

spring:
  application:
    name: gyeongjung-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      # 기본값(최대 10, 대기 30초)이면 DB가 느려질 때 요청이 30초씩 쌓여 스레드가 묶인다. 2코어 서버에서
      # HikariCP 공식(코어 수 × 2 + 디스크 수)에 가까운 5로 줄이고, 가득 차면 3초 안에 실패시킨다.
      # minimum-idle은 일부러 두지 않는다. 기본이 최대와 같은 고정 크기라서 연결을 늘렸다 줄이는 비용이 없다.
      maximum-pool-size: 5
      connection-timeout: 3000
  flyway:
    enabled: true

app:
  role: worker
