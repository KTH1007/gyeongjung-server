server:
  port: -1                      # worker는 사용자 요청을 받지 않는다. api 역할은 계획 2에서 SERVER_PORT=8080으로 연다
  shutdown: graceful

management:
  server:
    port: 8081
    address: 127.0.0.1          # 기본은 이 머신에서만 접근한다. 컨테이너는 MANAGEMENT_SERVER_ADDRESS=0.0.0.0로 연다
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      role: ${app.role}

logging:
  file:
    name: logs/gyeongjung.log
  logback:
    rollingpolicy:
      file-name-pattern: "${logging.file.name}.%d{yyyy-MM-dd, UTC}.%i.gz"
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
  pattern:
    correlation: "[%X] "

spring:
  application:
    name: gyeongjung-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      # 기본값(최대 10, 대기 30초)이면 DB가 느려질 때 요청이 30초씩 쌓여 스레드가 묶인다. 2코어 서버에서
      # HikariCP 공식(코어 수 × 2 + 디스크 수)에 가까운 5로 줄이고, 가득 차면 3초 안에 실패시킨다.
      # minimum-idle은 일부러 두지 않는다. 기본이 최대와 같은 고정 크기라서 연결을 늘렸다 줄이는 비용이 없다.
      maximum-pool-size: 5
      connection-timeout: 3000
  flyway:
    enabled: true

app:
  role: worker
